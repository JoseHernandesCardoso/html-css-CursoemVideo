<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Usando mídias em HTML5</h1>
    <hr>

    <h2>Imagens flexíveis</h2>
    <p>Tente mudar o tamanho da janela ou abrir o site em outro dispositivo. A imagem a baixo irá se adaptar ao tamanho da tela.</p>
    <picture>
        <source media="(max-width: 720px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1020px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="A imagem flexível funciona">
    </picture>

</body>
</html>
